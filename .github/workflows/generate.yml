name: Generate slides
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Semana (ej: week1). Deja auto para elegir por fecha"
        default: "auto"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-color-emoji
          pip install pillow requests
          mkdir -p fonts
          base=https://github.com/google/fonts/raw/main/ofl
          for f in Regular Medium Bold Italic; do
            curl -fsSL -o fonts/Poppins-$f.ttf $base/poppins/Poppins-$f.ttf
          done
          curl -fsSL -o fonts/Lora-Variable.ttf "$base/lora/Lora%5Bwght%5D.ttf"
      - name: Elegir semana
        id: wk
        run: |
          w="${{ github.event.inputs.week }}"
          w=$(echo "$w" | tr 'A-Z' 'a-z')
          if [ -z "$w" ] || [ "$w" = "auto" ]; then
            nextmon=$(date -u -d "next monday" +%s)
            start=$(date -u -d "2026-10-26" +%s)
            n=$(( (nextmon - start) / 604800 + 1 ))
            w="week$n"
          fi
          echo "week=$w" >> "$GITHUB_OUTPUT"
      - name: Generate slides
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python generate.py "${{ steps.wk.outputs.week }}"
      - name: Guardar en weeks y borrar antiguas
        run: |
          w="${{ steps.wk.outputs.week }}"
          mkdir -p weeks
          rm -rf "weeks/$w"
          cp -r out "weeks/$w"
          ls -d weeks/week* | sed -E 's#weeks/week##' | sort -n | head -n -2 | while read n; do rm -rf "weeks/week$n"; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A weeks
          git commit -m "Slides $w" || echo "sin cambios"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-slides-${{ steps.wk.outputs.week }}
          path: out
