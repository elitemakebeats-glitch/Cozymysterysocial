name: Generate slides
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "Semana (ej: week1). Deja auto para elegir por fecha"
        default: "auto"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-color-emoji
          pip install pillow requests
          mkdir -p fonts
          base=https://github.com/google/fonts/raw/main/ofl
          for f in Regular Medium Bold Italic; do
            curl -fsSL -o fonts/Poppins-$f.ttf $base/poppins/Poppins-$f.ttf
          done
          curl -fsSL -o fonts/Lora-Variable.ttf "$base/lora/Lora%5Bwght%5D.ttf"
      - name: Elegir semana
        id: wk
        run: |
          w="${{ github.event.inputs.week }}"
          if [ -z "$w" ] || [ "$w" = "auto" ]; then
            nextmon=$(date -u -d "next monday" +%s)
            start=$(date -u -d "2026-10-26" +%s)
            n=$(( (nextmon - start) / 604800 + 1 ))
            w="week$n"
          fi
          echo "week=$w" >> "$GITHUB_OUTPUT"
      - name: Generate slides
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python generate.py "${{ steps.wk.outputs.week }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-slides-${{ steps.wk.outputs.week }}
          path: out
